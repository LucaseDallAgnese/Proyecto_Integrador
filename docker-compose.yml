version: '3.8'

services:
  # 1. El servicio de la Aplicación (PHP-FPM)
  app:
    build:
      context: . # Usa el Dockerfile en el directorio actual
      args:
        UID: ${UID:-1000} # Pasa variables de entorno para permisos
        GID: ${GID:-1000}
    image: terastore/laravel-app # Nombra tu imagen
    container_name: laravel_app
    restart: unless-stopped
    volumes:
      - .:/var/www
    networks:
      - laravel_network

  # 2. El servidor Web (Nginx)
  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8000:80" # Expone el puerto 8000 en tu máquina local
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf # Configuración de Nginx
    depends_on:
      - app
    networks:
      - laravel_network

  # 3. La Base de Datos (MySQL)
  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql # Volumen para persistir datos
    ports:
      - "3306:3306"
    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge

volumes:
  db_data:
    driver: local